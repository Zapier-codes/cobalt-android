name: Build

# Only `push` — `pull_request` was removed (see ARCHITECTURE.md's CI section
# for the full story). This project's real workflow is direct commits to
# branches (git am + push from a device, no PR-gated merges), so a commit
# on any branch that also happened to be part of an open PR was triggering
# TWO builds: one for the exact pushed commit, one for a synthetic
# GitHub-generated PR merge commit. Those can diverge (different tree,
# different Gradle cache warm state) and show different pass/fail results
# for what looks like "the same" run — the actual root cause behind CI
# appearing to fail then immediately succeed with no code change in
# between. One trigger, one build, one unambiguous result per commit.
on:
  push:
    branches: ["**"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "gradle"

      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/sdk
            ~/.android/cache
          key: android-sdk-${{ runner.os }}

      - name: Cache Gradle wrapper + dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Compute decimal build number
        if: success() && github.ref == 'refs/heads/master'
        id: version
        run: |
          BASE="1.0"
          BUILD_NUM="${{ github.run_number }}"
          echo "tag=${BASE}.${BUILD_NUM}" >> "$GITHUB_OUTPUT"

      - name: Find built APK
        if: success() && github.ref == 'refs/heads/master'
        id: apk
        run: |
          APK_PATH=$(find . -path "*/outputs/apk/debug/*.apk" | head -n 1)
          echo "path=${APK_PATH}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release with APK
        if: success() && github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.version.outputs.tag }}"
          name: "v${{ steps.version.outputs.tag }}"
          files: ${{ steps.apk.outputs.path }}
