name: Update remote config

# Lets the deployed cobalt instance URL be changed for every installed
# client without an app release: set the COBALT_INSTANCE_URL repository
# variable (Settings -> Secrets and variables -> Actions -> Variables) to
# the current instance URL, then either run this workflow manually or push
# a change to it — it commits the new value into remote-config.json, which
# RemoteConfigRepository (app/src/main/java/com/cobalt/android/remoteconfig/)
# fetches at runtime. See that class's doc comment and remote-config.json's
# own top-level "_comment" for the full picture, including why the API key
# deliberately isn't handled this way.
#
# This workflow does NOT read or need any secret — COBALT_INSTANCE_URL is
# a plain repository *variable*, not a *secret*, because remote-config.json
# ends up public either way (served via raw.githubusercontent.com with no
# auth) — storing it as a "secret" would be misleading, not more secure.

on:
  workflow_dispatch: {}
  schedule:
    # Periodic safety net in case COBALT_INSTANCE_URL is updated in the
    # repo's variable settings without anyone remembering to also run this
    # workflow by hand. Not required for the manual-trigger path to work.
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  update-remote-config:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write remote-config.json from the COBALT_INSTANCE_URL variable
        env:
          COBALT_INSTANCE_URL: ${{ vars.COBALT_INSTANCE_URL }}
        run: |
          if [ -z "$COBALT_INSTANCE_URL" ]; then
            echo "COBALT_INSTANCE_URL repository variable is not set — leaving remote-config.json untouched."
            exit 0
          fi
          cat > remote-config.json <<EOF
          {
            "_comment": "Fetched at runtime by RemoteConfigRepository (app/src/main/java/com/cobalt/android/remoteconfig/RemoteConfigRepository.kt) via raw.githubusercontent.com. This file is regenerated by .github/workflows/update-remote-config.yml from the COBALT_INSTANCE_URL repository variable — edit that variable, not this file, if this workflow is enabled; a direct edit here will just be overwritten on the next run. Do NOT add an API key or any other secret to this file — it is served from a public repo with no auth.",
            "cobaltInstanceUrl": "$COBALT_INSTANCE_URL"
          }
          EOF

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- remote-config.json; then
            echo "remote-config.json already up to date."
            exit 0
          fi
          git add remote-config.json
          git commit -m "Update remote-config.json from COBALT_INSTANCE_URL variable"
          git push
